# WorkBuddy2API-Hub Docker Compose
# 部署：docker compose up -d
# 更新：docker compose pull && docker compose up -d
services:
  wb-proxy:
    # 追最新稳定版用 :latest；想固定版本可换成具体版本号（如 :v1.6.11）
    image: ghcr.io/ardeyouxipianyi/workbuddy2api-hub:latest
    container_name: wb-proxy
    restart: unless-stopped
    # 默认 root(0:0)。命名卷初始属主为 root，若改成非 0 的 PUID/PGID，
    # 需先手动 chown 卷目录，否则容器内会写不进去。
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 宿主机端口:容器端口（右侧必须与下面的 PORT 保持一致）
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则启动时自动生成高强度 API Key 写入 settings.json 并打印在启动日志中
      # - API_KEY=your_secret_key
      - TZ=Asia/Shanghai
      # 默认 auto：镜像内 Go/uTLS 桥可用则使用，不可用则自动回退 Python/OpenSSL。
      # 彻底关闭桥时改为 python；强制桥（失败即报错）时改为 node。
      # - WB_TLS_FINGERPRINT=python
    volumes:
      # 持久化数据目录（命名卷，升级与重建容器时绝不丢失配置与用量）
      - wb-accounts:/app/accounts
      - wb-usage:/app/usage

volumes:
  wb-accounts:
  wb-usage:
